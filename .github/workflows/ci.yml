# FinLearn CI. The project lives in the finlearn/ subdirectory of the repo;
# all jobs use it as working-directory.
name: CI

on:
  push:
    branches: [main]
    paths:
      - 'finlearn/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'finlearn/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

# Cancel superseded runs of the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: finlearn

jobs:
  server-tests:
    name: Server tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finlearn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # No .env in CI (gitignored): the server reads these directly.
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: finlearn
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: finlearn/server/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: finlearn/server

      - name: Run tests
        run: pnpm test
        working-directory: finlearn/server

  client:
    name: Client lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: finlearn/client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: finlearn/client

      # Add `pnpm test` here once the client has real tests.
      - name: Lint
        run: pnpm lint
        working-directory: finlearn/client

      - name: Build
        run: pnpm build
        working-directory: finlearn/client

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    env:
      # Placeholders for compose interpolation; builds don't consume them.
      DB_USER: ci
      DB_PASSWORD: ci
      DB_NAME: ci
      JWT_SECRET: ci
    steps:
      - uses: actions/checkout@v4

      # -f docker-compose.yml: production images, no dev override.
      - name: Build production images
        run: docker compose -f docker-compose.yml build server client
